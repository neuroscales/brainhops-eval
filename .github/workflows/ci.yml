name: Test evaluation tooling
on:
  push:
    branches: [main, scaffold-evaluation]
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: neuroscales/brainhops
          path: work/brainhops-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r software/simpleitk/requirements.txt -e '.[test]' './work/brainhops-source[nifti,pillow,itk]'
      - run: pytest -q
  interoperability:
    uses: ./.github/workflows/evaluate.yml
    with:
      brainhops_ref: main
      packages: all
      interface: python

