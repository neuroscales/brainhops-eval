[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainhops-eval"
version = "0.1.0"
description = "Reproducible registration and resampling interoperability fixtures"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "nibabel>=5.2", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8", "PyYAML>=6", "ruff==0.17.1"]

[project.scripts]
brainhops-eval = "brainhops_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.setuptools.package-data]
brainhops_eval = ["assets/*.css", "assets/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "D101", "D102", "D103"]
